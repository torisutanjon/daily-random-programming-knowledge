# Opens/updates a release PR (version bump + CHANGELOG.md) on every push to main;
# merging that PR tags the version and publishes a GitHub Release with the same notes.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
