# Opens/updates a release PR (version bump + CHANGELOG.md) on every push to main;
# merging that PR tags the version and publishes a GitHub Release with the same notes, then builds and attaches the Windows installer.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # The repo's default branch is develop; releases are cut from main.
        with:
          target-branch: main

  # A release created with GITHUB_TOKEN doesn't trigger other workflows, so build from here.
  installer:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-installer.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
