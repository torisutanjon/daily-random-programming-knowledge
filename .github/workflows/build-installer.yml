# Builds the Windows installer for a release tag and attaches it to that GitHub Release.
# release-please.yml calls this when a release is created; it can also be run by hand
# (Actions → build-installer → Run workflow) for an existing tag.
name: build-installer

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.1.0
        type: string
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The tag goes through env, never inline into the script.
      - name: Check the tag matches package.json
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # electron-builder must never publish on its own; the next step uploads.
      - run: yarn dist --publish never
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "dist/drpk Setup $VERSION.exe" --clobber
